name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llm:
        description: "Also run the real-LLM evaluation (needs LLM_API_KEY secret)"
        type: boolean
        default: false

jobs:
  tests:
    name: Unit + end-to-end tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  eval-clean:
    name: Release gate - clean agent must PASS
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: agent-qa run --agent clean
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-clean, path: results/ }

  eval-buggy:
    name: Self-check - buggy agent must be CAUGHT
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      # The gate must go red on the buggy release; if it passes, the suite is blind.
      - run: |
          if agent-qa run --agent buggy; then
            echo "::error::The buggy agent passed - the test suite missed injected bugs"
            exit 1
          fi
          echo "Buggy release correctly rejected."
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-buggy, path: results/ }

  eval-llm:
    name: Real LLMs - tester agent vs agent, LLM judge, Langfuse
    if: github.event_name == 'workflow_dispatch' && inputs.llm
    needs: tests
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      TESTER_MODEL: ${{ vars.TESTER_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[llm]"
      - run: agent-qa run --agent clean --mode llm
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-llm, path: results/ }
